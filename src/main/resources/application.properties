# =============================================================================
# Smart Vehicle Parking Management System Configuration
# =============================================================================

# =============================================================================
# Application Name & Port
# =============================================================================

spring.application.name=smart-vehicle-parking-management-system

# Render provides PORT automatically.
# Locally, the application uses port 8080.
server.port=${PORT:8080}


# =============================================================================
# MySQL Database Configuration
# =============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_parking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =============================================================================
# Hibernate / JPA Configuration
# =============================================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}


# =============================================================================
# CORS Configuration
# =============================================================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173}