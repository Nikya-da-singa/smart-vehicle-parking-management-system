services:
  - type: web
    name: parkflow-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
